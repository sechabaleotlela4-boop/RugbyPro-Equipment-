<main>

<h2>Product Enquiry</h2>

<p>
Complete the form below if you would like more information
about our products.
</p>


<form>

<label for="name">Full Name:</label>
<br>
<input type="text" id="name" name="name">

<br><br>


<label for="email">Email Address:</label>
<br>
<input type="email" id="email" name="email">

<br><br>


<label for="phone">Phone Number:</label>
<br>
<input type="text" id="phone" name="phone">

<br><br>


<label for="product">Product Interested In:</label>
<br>

<select id="product" name="product">

<option>Rugby Ball</option>
<option>Rugby Boots</option>
<option>Rugby Jersey</option>
<option>Protective Equipment</option>
<option>Training Equipment</option>

</select>

<br><br>


<label for="message">Message:</label>
<br>

<textarea id="message" name="message"></textarea>

<br><br>


<button type="submit">
Submit Enquiry
</button>


</form>
